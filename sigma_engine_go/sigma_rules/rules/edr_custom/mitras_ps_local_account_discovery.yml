title: PowerShell Local Account and Group Discovery
id: bcc784ca-8489-4b37-938b-b0929df6b996
status: test
description: Detects read-only local account and group discovery cmdlets in script block telemetry, including commands entered into an existing PowerShell process. These cmdlets do not demonstrate account modification.
author: MITRAS
date: 2026-10-10
references:
    - https://github.com/redcanaryco/atomic-red-team/blob/388942adbd9641f4dfdcf079d7efe9a75ec0ac43/atomics/T1087.001/T1087.001.yaml
logsource:
    product: windows
    category: ps_script
detection:
    selection:
        ScriptBlockText|re: '(?i)\bGet-Local(User|Group(Member)?)\b'
    condition: selection
falsepositives:
    - Authorized local account inventory and help desk administration
level: medium
tags:
    - attack.discovery
    - attack.t1087.001
    - attack.t1069.001
